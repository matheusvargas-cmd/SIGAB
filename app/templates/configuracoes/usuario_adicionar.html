{% extends 'shared/base.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">{{ titulo }}</h2>
    <a class="btn btn-outline-secondary" href="/configuracoes/usuarios">Voltar</a>
</div>

{% if erro %}
<div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<form class="card" method="post" action="/configuracoes/usuarios/adicionar">
    <div class="card-body p-4">
        <p class="text-muted">Informe o e-mail de um usuário que já tem conta no Gabinete 360 para vinculá-lo a este gabinete.</p>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="email">E-mail *</label>
                <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autofocus>
            </div>
        </div>
    </div>
    <div class="card-footer bg-white text-end">
        <a class="btn btn-outline-secondary" href="/configuracoes/usuarios">Cancelar</a>
        <button class="btn btn-primary" type="submit">Buscar</button>
    </div>
</form>
{% endblock %}
