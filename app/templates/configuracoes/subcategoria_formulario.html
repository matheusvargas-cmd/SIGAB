{% extends 'shared/base.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">{{ titulo }}</h2>
    <a class="btn btn-outline-secondary" href="/configuracoes/categorias/{{ categoria.id }}">Voltar</a>
</div>

<p class="text-muted">Categoria: <strong>{{ categoria.nome }}</strong></p>

{% if erro %}
<div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<form class="card" method="post" action="{% if subcategoria and subcategoria.id %}/configuracoes/categorias/{{ categoria.id }}/subcategorias/{{ subcategoria.id }}/editar{% else %}/configuracoes/categorias/{{ categoria.id }}/subcategorias/novo{% endif %}">
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label" for="nome">Nome *</label>
                <input class="form-control" id="nome" name="nome" value="{{ subcategoria.nome if subcategoria else '' }}" maxlength="60" minlength="2" required autofocus>
            </div>
        </div>
    </div>
    <div class="card-footer bg-white text-end">
        <a class="btn btn-outline-secondary" href="/configuracoes/categorias/{{ categoria.id }}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
</form>
{% endblock %}
