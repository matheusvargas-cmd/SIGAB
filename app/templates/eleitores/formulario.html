{% extends 'shared/base.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">{{ titulo }}</h2>
    <a class="btn btn-outline-secondary" href="/eleitores">Voltar</a>
</div>

{% if erro %}
<div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<form class="card" method="post" action="{% if eleitor and eleitor.id %}/eleitores/{{ eleitor.id }}/editar{% else %}/eleitores/novo{% endif %}">
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label" for="nome">Nome *</label>
                <input class="form-control" id="nome" name="nome" value="{{ eleitor.nome if eleitor else '' }}" maxlength="150" minlength="3" required autofocus>
                <div class="form-text">Mínimo de 3 caracteres.</div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="apelido">Apelido</label>
                <input class="form-control" id="apelido" name="apelido" value="{{ eleitor.apelido if eleitor and eleitor.apelido else '' }}" maxlength="100">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="nascimento">Nascimento</label>
                <input class="form-control" id="nascimento" name="nascimento" type="date" value="{{ eleitor.nascimento.isoformat() if eleitor and eleitor.nascimento else '' }}">
            </div>
            <div class="col-12">
                <p class="form-secao-titulo mb-0">Contato</p>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="telefone">Telefone</label>
                <input class="form-control" id="telefone" name="telefone" value="{{ eleitor.telefone if eleitor and eleitor.telefone else '' }}" maxlength="15" placeholder="(00) 00000-0000" inputmode="tel">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="whatsapp">WhatsApp</label>
                <input class="form-control" id="whatsapp" name="whatsapp" value="{{ eleitor.whatsapp if eleitor and eleitor.whatsapp else '' }}" maxlength="15" placeholder="(00) 00000-0000" inputmode="tel">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" id="email" name="email" type="email" value="{{ eleitor.email if eleitor and eleitor.email else '' }}" maxlength="150">
            </div>
            <div class="col-12">
                <p class="form-secao-titulo mb-0">Documentos eleitorais</p>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cpf">CPF</label>
                <input class="form-control" id="cpf" name="cpf" value="{{ eleitor.cpf if eleitor and eleitor.cpf else '' }}" maxlength="14" placeholder="000.000.000-00" inputmode="numeric">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="titulo_eleitor">Título de eleitor</label>
                <input class="form-control" id="titulo_eleitor" name="titulo_eleitor" value="{{ eleitor.titulo_eleitor if eleitor and eleitor.titulo_eleitor else '' }}" maxlength="12" inputmode="numeric">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="zona_eleitoral">Zona eleitoral</label>
                <input class="form-control" id="zona_eleitoral" name="zona_eleitoral" value="{{ eleitor.zona_eleitoral if eleitor and eleitor.zona_eleitoral else '' }}" maxlength="10" inputmode="numeric">
            </div>
            <div class="col-12">
                <p class="form-secao-titulo mb-0">Localização</p>
            </div>
            <div class="col-12">
                <label class="form-label" for="endereco">Endereço</label>
                <input class="form-control" id="endereco" name="endereco" value="{{ eleitor.endereco if eleitor and eleitor.endereco else '' }}" maxlength="255">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="bairro">Bairro</label>
                <input class="form-control" id="bairro" name="bairro" value="{{ eleitor.bairro if eleitor and eleitor.bairro else '' }}" maxlength="100">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="cidade">Cidade</label>
                <input class="form-control" id="cidade" name="cidade" value="{{ eleitor.cidade if eleitor and eleitor.cidade else '' }}" maxlength="100">
            </div>
            <div class="col-12">
                <label class="form-label" for="observacoes">Observações</label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="4">{{ eleitor.observacoes if eleitor and eleitor.observacoes else '' }}</textarea>
            </div>
        </div>
    </div>
    <div class="card-footer bg-white text-end">
        <a class="btn btn-outline-secondary" href="/eleitores">Cancelar</a>
        <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
</form>

<script>
(function () {
    function formatarTelefone(valor) {
        const digitos = valor.replace(/\D/g, '').slice(0, 11);
        if (digitos.length > 10) {
            return digitos.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, function (_, ddd, parte1, parte2) {
                return parte2 ? '(' + ddd + ') ' + parte1 + '-' + parte2 : '(' + ddd + ') ' + parte1;
            });
        }
        if (digitos.length > 6) {
            return digitos.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, function (_, ddd, parte1, parte2) {
                return parte2 ? '(' + ddd + ') ' + parte1 + '-' + parte2 : '(' + ddd + ') ' + parte1;
            });
        }
        if (digitos.length > 2) {
            return digitos.replace(/^(\d{2})(\d{0,4}).*/, '($1) $2');
        }
        if (digitos.length > 0) {
            return digitos.replace(/^(\d{0,2}).*/, '($1');
        }
        return '';
    }

    ['telefone', 'whatsapp'].forEach(function (id) {
        const campo = document.getElementById(id);
        if (!campo) return;
        campo.addEventListener('input', function () {
            campo.value = formatarTelefone(campo.value);
        });
    });
})();
</script>
{% endblock %}
