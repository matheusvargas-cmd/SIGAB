{% extends 'auth/base_auth.html' %}

{% block conteudo_auth %}
<h1 class="h5 text-center mb-4" style="color: var(--c360-azul-principal);">Esqueci minha senha</h1>

<p class="text-muted small text-center mb-4">
    Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para você redefinir a senha.
</p>

<form method="post" action="/esqueci-senha">
    <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" required autofocus>
    </div>
    <button class="btn btn-primary w-100" type="submit">Enviar instruções</button>
    <div class="text-center mt-3">
        <a class="small" href="/login">Voltar para o login</a>
    </div>
</form>
{% endblock %}
