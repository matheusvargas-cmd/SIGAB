{% extends 'auth/base_auth.html' %}

{% block conteudo_auth %}
<h1 class="h5 text-center mb-4" style="color: var(--c360-azul-principal);">Redefinir senha</h1>

{% if erro %}
<div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
{% endif %}

<form method="post" action="/redefinir-senha/{{ token }}">
    <div class="mb-3">
        <label class="form-label" for="nova_senha">Nova senha</label>
        <input class="form-control" type="password" id="nova_senha" name="nova_senha" minlength="8" required autofocus>
        <div class="form-text">Mínimo 8 caracteres.</div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="confirmar_senha">Confirmar nova senha</label>
        <input class="form-control" type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Redefinir senha</button>
</form>
{% endblock %}
