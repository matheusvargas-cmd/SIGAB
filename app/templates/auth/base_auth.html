<!doctype html>
<html lang='pt-br'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>{{ titulo }} · Gabinete 360</title>
<link rel='icon' type='image/x-icon' href='/static/img/favicon.ico'>
<link rel='icon' type='image/png' sizes='32x32' href='/static/img/icone-32.png'>
<link rel='icon' type='image/png' sizes='64x64' href='/static/img/icone-64.png'>
<link rel='icon' type='image/png' sizes='128x128' href='/static/img/icone-128.png'>
<link href='/static/css/bootstrap.min.css' rel='stylesheet'>
<link href='/static/css/style.css' rel='stylesheet'>
<style>
    body.tela-auth {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, var(--c360-azul-principal), var(--c360-azul-principal-escuro));
        padding: 1.5rem;
    }
    .cartao-auth {
        width: 100%;
        max-width: 380px;
        background: var(--c360-branco);
        border-radius: var(--c360-radius);
        box-shadow: var(--c360-sombra-forte);
        padding: 2.2rem 2rem;
    }
    .cartao-auth .logo-auth {
        display: block;
        margin: 0 auto 1.6rem;
        max-width: 220px;
        height: auto;
    }
</style>
</head>
<body class="tela-auth">
<div class="cartao-auth">
    <img src="/static/img/logo-horizontal.png" alt="Gabinete 360 — Gestão Inteligente de Gabinetes" class="logo-auth">
    {% block conteudo_auth %}{% endblock %}
</div>
</body>
</html>
