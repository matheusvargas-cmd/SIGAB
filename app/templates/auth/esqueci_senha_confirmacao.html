{% extends 'auth/base_auth.html' %}

{% block conteudo_auth %}
<h1 class="h5 text-center mb-3" style="color: var(--c360-azul-principal);">Verifique seu e-mail</h1>
<p class="text-muted small text-center mb-4">
    Se o e-mail informado estiver cadastrado, você receberá em poucos minutos um link para redefinir sua senha.
    O link é válido por 30 minutos e só pode ser usado uma vez.
</p>
<a class="btn btn-outline-primary w-100" href="/login">Voltar para o login</a>
{% endblock %}
