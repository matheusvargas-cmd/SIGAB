{% extends 'shared/base_superadmin.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">{{ titulo }}</h2>
    <a class="btn btn-outline-secondary" href="/superadmin/gabinetes/{{ gabinete.id }}/usuarios">Voltar</a>
</div>

{% if erro %}
<div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<form class="card" method="post" action="/superadmin/gabinetes/{{ gabinete.id }}/usuarios/{{ membro.id }}/editar">
    <div class="card-body p-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="nome">Nome *</label>
                <input class="form-control" id="nome" name="nome" value="{{ membro.usuario.nome }}" minlength="2" required autofocus>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">E-mail *</label>
                <input class="form-control" type="email" id="email" name="email" value="{{ membro.usuario.email }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="perfil">Perfil neste gabinete *</label>
                <select class="form-select" id="perfil" name="perfil" required>
                    {% for opcao in perfis_opcoes %}
                    <option value="{{ opcao }}" {% if membro.perfil == opcao %}selected{% endif %}>{{ opcao }}</option>
                    {% endfor %}
                </select>
                <div class="form-text">Um gabinete pode ter mais de um ADMIN.</div>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="ativo" name="ativo" {% if membro.ativo %}checked{% endif %}>
                    <label class="form-check-label" for="ativo">Vínculo ativo neste gabinete</label>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer bg-white text-end">
        <a class="btn btn-outline-secondary" href="/superadmin/gabinetes/{{ gabinete.id }}/usuarios">Cancelar</a>
        <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
</form>
{% endblock %}
